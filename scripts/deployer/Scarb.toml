[package]
name = "deployer"
version = "0.1.0"
edition = "2024_07"

[dependencies]
sncast_std = "0.45.0"
starknet = "2.11.4"
snforge_std = "0.45.0"
openzeppelin = "2.0.0"
openzeppelin_testing = "4.2.0"
lbtc_token = { path = "../../packages/token" }

[dev-dependencies]
cairo_test = "2.11.4"

[lib]
sierra = true
casm = true

[[target.starknet-contract]]
build-external-contracts = [
    "lbtc_token::lbtc::token::lbtc"
]