[package]
name = "deployer_v2"
version = "0.1.0"
edition = "2024_07"

[dependencies]
sncast_std = "0.41.0"
starknet = "2.11.2"
snforge_std = "0.41.0"
openzeppelin = { git = "https://github.com/OpenZeppelin/cairo-contracts", rev = "bc66fb75b9d9f118d8951ae1afcd71cf2b54102b"}
openzeppelin_testing = "3.0.0"
lbtc_token = { path = "../../packages/token" }
lbtc_bridge = { path = "../../packages/bridge" }

[dev-dependencies]
cairo_test = "2.11.4"

[lib]
sierra = true
casm = true

[[target.starknet-contract]]
build-external-contracts = [
    "lbtc_token::lbtc::token::lbtc",
    "lbtc_bridge::bridge::bridge",
    "lbtc_bascule::bascule::bascule",
    "lbtc_consortium::consortium::consortium",
]