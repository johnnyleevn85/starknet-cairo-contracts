[package]
name = "deployer_v2"
version = "0.1.0"
edition = "2024_07"

[dependencies]
sncast_std = "0.45.0"
starknet = "2.11.4"
snforge_std = "0.45.0"
openzeppelin = "2.0.0"
openzeppelin_testing = "4.2.0"
lbtc_token = { path = "../../packages/token" }
lbtc_asset_router = { path = "../../packages/asset_router" }

[dev-dependencies]
cairo_test = "2.11.4"

[lib]
sierra = true
casm = true

[[target.starknet-contract]]
build-external-contracts = [
    "lbtc_token::lbtc::token::lbtc",
    "lbtc_asset_router::asset_router::asset_router",
    "lbtc_bascule::bascule::bascule",
    "lbtc_consortium::consortium::consortium",
]