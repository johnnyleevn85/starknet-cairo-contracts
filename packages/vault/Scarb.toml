[package]
name = "lbtc_vault"
readme = "README.md"
keywords = [
   "wip"
]
version.workspace = true
edition.workspace = true
description.workspace = true
documentation.workspace = true
repository.workspace = true
license-file.workspace = true

[tool]
fmt.workspace = true
scarb.workspace = true

[dependencies]
starknet.workspace = true
openzeppelin.workspace = true
starkware_utils.workspace = true
lbtc_manual_strategy = {path = "../manual_strategy" }

[dev-dependencies]
assert_macros.workspace = true
snforge_std.workspace = true
openzeppelin_testing.workspace = true
starkware_utils_testing.workspace = true
lbtc_testing = { path = "../testing" }
lbtc_token = { path = "../token" }

[[test]]
name = "lbtc_vault_unittest"

[scripts]
test = "SNFORGE_BACKTRACE=1 snforge test"

[lib]

[[target.starknet-contract]]
sierra = true
casm = true
casm-add-pythonic-hints = true

[profile.dev.cairo]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true
inlining-strategy = "avoid"

[[test]]
build-external-contracts = [
    "lbtc_token::lbtc::token::lbtc",
]
