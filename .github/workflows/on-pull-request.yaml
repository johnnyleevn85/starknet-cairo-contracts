name: CI

on:
  pull_request:
    branches:
      - dev

jobs:
  CI:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install asdf
        run: scripts/install_asdf.sh

      - name: Load asdf and check version

        run: |
          source "$HOME/.asdf/asdf.sh"
          asdf --version

      - uses: actions/checkout@v4

      - uses: foundry-rs/setup-snfoundry@v3
        with:
          starknet-foundry-version: "0.38.3"
      
      - uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.11.2"

      - name: Install cairo-coverage
        run: |
          curl -L https://raw.githubusercontent.com/software-mansion/cairo-coverage/main/scripts/install.sh | sh

      - name: Run test and coverage
        run: scarb test -w --coverage

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/token/coverage/coverage.lcov
          fail_ci_if_error: true

      - name: Check formatting
        run: |
          scarb fmt -w --check

      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Run python Tests...
        run: scripts/python_tests.sh
