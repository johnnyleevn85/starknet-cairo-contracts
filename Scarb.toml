[workspace]
members = [
    "packages/token",
    "packages/bascule",
    "packages/consortium",
]


[package]
name = "sn_lbtc"
readme = "README.md"
version.workspace = true
keywords.workspace = true
edition.workspace = true

[workspace.package]
version = "0.0.1"
edition = "2024_07"
description = "WIP"
documentation = "WIP"
repository = "WIP"
license-file = "LICENSE"
keywords = [
    "WIP"
]

[workspace.dependencies]
assert_macros = "2.11.2"
openzeppelin = "1.0.0"
openzeppelin_testing = "2.0.0"
snforge_std = "0.38.3"
starknet = "2.11.2"
starkware_utils = { git = "https://github.com/starkware-libs/starkware-starknet-utils", rev = "334bbee1be1dcd331a0e66162abee36dc42d18d1" }

[workspace.tool.fmt]
sort-module-level-items = true

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[tool]
fmt.workspace = true
scarb.workspace = true


[dependencies]
lbtc_token = {path = "packages/token"}
lbtc_bascule = {path = "packages/bascule"}
lbtc_consortium = {path = "packages/consortium"}
openzeppelin.workspace = true
starknet.workspace = true
starkware_utils.workspace = true

[dev-dependencies]
assert_macros.workspace = true
snforge_std.workspace = true
openzeppelin_testing.workspace = true


[scripts]
test = "SNFORGE_BACKTRACE=1 snforge test"

[lib]
[[target.starknet-contract]]

[[test]]
name = "sn_lbtc_unittest"


[profile.dev.cairo]
unstable-add-statements-code-locations-debug-info = true
unstable-add-statements-functions-debug-info = true
inlining-strategy = "avoid"
