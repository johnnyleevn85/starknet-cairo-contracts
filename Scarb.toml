[workspace]
members = [
    "packages/token",
    "packages/bascule",
    "packages/consortium",
    "packages/bridge",
]


[workspace.package]
version = "0.1.0"
edition = "2024_07"
description = "WIP"
documentation = "WIP"
repository = "WIP"
license-file = "LICENSE"
keywords = [
    "WIP"
]

[workspace.dependencies]
starknet = "2.11.2"
snforge_std = "0.38.3"
assert_macros = "2.11.2"
openzeppelin = "1.0.0"
openzeppelin_testing = "2.0.0"
alexandria_sorting = "0.5.0"
starkware_utils = { git ="https://github.com/starkware-libs/starkware-starknet-utils", branch="main" }
starkware_utils_testing = { git="https://github.com/starkware-libs/starkware-starknet-utils", branch="main" }

[workspace.tool.fmt]
sort-module-level-items = true

[workspace.tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

[scripts]
test = "SNFORGE_BACKTRACE=1 snforge test"

[[target.starknet-contract]]

[[test]]
name = "sn_lbtc_unittest"


[profile.dev.cairo]
unstable-add-statements-code-locations-debug-info = true
unstable-add-statements-functions-debug-info = true
inlining-strategy = "avoid"
